name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Syntax check
        run: |
          node --check src/client.mjs
          node --check src/mcp.mjs
          node --check src/mcpShared.mjs
          node --check src/server.mjs
          node --check src/config.mjs
          node --check src/pool.mjs
          node --check src/helpers.mjs
          node --check src/dispatch.mjs
          node --check src/index.mjs

      - name: ESLint
        run: npx eslint src/ scripts/

      - name: Markdown lint
        run: npx markdownlint-cli2 README.md

      - name: Unit test files
        run: npm run test:unit

  package-smoke:
    name: Packed Package Smoke (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Build slim package
        run: npm run pack
      - name: Install and start packed MCP server
        run: node scripts/smoke-packed-package.mjs

  publish:
    name: Publish to npm
    needs: [ci, package-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Build slim package
        run: npm run pack
      - name: Install and start packed MCP server
        run: node scripts/smoke-packed-package.mjs
      - name: Publish to npm
        run: |
          PACKAGE=$(node -e "console.log(require('./package.json').name)")
          VERSION=$(node -e "console.log(require('./package.json').version)")
          TARBALL="bgx4k3p-huly-mcp-server-${VERSION}.tgz"
          if [ ! -f "$TARBALL" ]; then
            echo "Tarball not found: $TARBALL"
            exit 1
          fi
          if npm view "${PACKAGE}@${VERSION}" version --silent >/dev/null 2>&1; then
            echo "${PACKAGE}@${VERSION} is already published"
            exit 0
          fi
          npm publish "$TARBALL" --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PACKAGE=$(node -e "console.log(require('./package.json').name)")
          VERSION=$(node -e "console.log(require('./package.json').version)")
          TAG="v${VERSION}"
          NPM_URL="https://www.npmjs.com/package/${PACKAGE}/v/${VERSION}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "GitHub release ${TAG} already exists"
            exit 0
          fi

          cat > release-notes.md <<EOF
          Published to npm:

          ${NPM_URL}

          Install:

          \`\`\`sh
          npx -y ${PACKAGE}@${VERSION}
          \`\`\`

          This release was validated by the packed-package smoke test on Node.js 22, 24, and 26.
          EOF

          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file release-notes.md \
            --target "${GITHUB_SHA}"
